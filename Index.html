
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLICKIE — Camera Rental & Booking</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>

    <style>
        :root {
            --bg-primary: #FAFAFA; --bg-surface: #FFFFFF; --bg-card: #FFFFFF;
            --bg-dark: #121212; --bg-dark-surface: #1E1E1E;
            --text-primary: #121212; --text-secondary: #666666; --text-muted: #999999; --text-light: #F5F3EF;
            --accent-gold: #C5A059; --accent-gold-hover: #B38E46; --accent-gold-light: #F9F5EC;
            --border-color: #E8E2D5; --border-light: #F0EDE6;
            --status-success: #10B981; --status-warning: #F59E0B; --status-danger: #EF4444; --status-info: #3B82F6;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --shadow-lg: 0 16px 32px rgba(0,0,0,0.12);
            --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px; --radius-full: 9999px;
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg-primary); color: var(--text-primary); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; overflow-x: hidden; }

        #app-container { width: 100%; max-width: 1200px; min-height: 100vh; background-color: var(--bg-primary); position: relative; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.05); }

        header.app-header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-light); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

        .brand-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.15rem; letter-spacing: 1px; color: var(--text-primary); text-decoration: none; cursor: pointer; flex-shrink: 0; }
        .brand-logo i { color: var(--accent-gold); font-size: 1.35rem; }

        .header-actions { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; justify-content: flex-end; }

        .btn-install-pwa { display: none; align-items: center; gap: 6px; background: var(--accent-gold); color: #fff; border: none; padding: 6px 14px; border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(197,160,89,0.3); transition: var(--transition); }
        .btn-install-pwa:hover { background: var(--accent-gold-hover); }

        /* ===== HEADER AUTH AREA ===== */
        #header-auth-area { display: flex; align-items: center; gap: 8px; }

        .btn-header-login {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: var(--bg-dark);
            color: #fff;
            border: none;
            border-radius: var(--radius-full);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .btn-header-login:hover { background: #2A2A2A; transform: translateY(-1px); }
        .btn-header-login i { font-size: 0.85rem; }

        .btn-header-register {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--accent-gold);
            color: #fff;
            border: none;
            border-radius: var(--radius-full);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(197,160,89,0.35);
        }
        .btn-header-register:hover { background: var(--accent-gold-hover); transform: translateY(-1px); }

        .header-user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px 4px 4px;
            background: var(--bg-primary);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: var(--transition);
            max-width: 200px;
            min-width: 0;
        }
        .header-user-chip:hover {
            border-color: var(--accent-gold);
            background: var(--accent-gold-light);
            box-shadow: 0 2px 8px rgba(197,160,89,0.15);
        }
        .header-user-chip.admin {
            border-color: var(--accent-gold);
            background: var(--accent-gold-light);
        }
        .header-user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bg-dark);
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .header-user-chip.admin .header-user-avatar {
            background: var(--accent-gold);
            color: #fff;
        }
        .header-user-info {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
            min-width: 0;
            overflow: hidden;
        }
        .header-user-name {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-user-role {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-header-logout {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1.5px solid var(--border-color);
            color: var(--status-danger);
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .btn-header-logout:hover {
            background: #FEE2E2;
            border-color: var(--status-danger);
            transform: translateY(-1px);
        }

        @media (max-width: 640px) {
            .btn-header-register { display: none; }
            .header-user-chip { padding: 4px; max-width: 44px; }
            .header-user-info { display: none; }
        }

        @media (max-width: 420px) {
            .brand-logo span { display: none; }
            .btn-header-login { padding: 8px 12px; font-size: 0.78rem; }
        }

        main.main-content { flex: 1; padding: 20px; padding-bottom: 90px; }
        @media (min-width: 900px) { main.main-content { padding-bottom: 40px; } }

        nav.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 1200px; background: rgba(18,18,18,0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; justify-content: space-around; align-items: center; padding: 10px 0 14px; border-top: 1px solid rgba(255,255,255,0.1); z-index: 200; }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #888888; text-decoration: none; font-size: 0.72rem; font-weight: 600; transition: var(--transition); cursor: pointer; background: none; border: none; width: 20%; }
        .nav-item i { font-size: 1.25rem; }
        .nav-item.active { color: var(--accent-gold); }
        .nav-item.active i { transform: translateY(-2px); }

        .admin-wrapper { display: grid; grid-template-columns: 240px 1fr; gap: 24px; min-height: calc(100vh - 120px); }
        @media (max-width: 899px) {
            .admin-wrapper { grid-template-columns: 1fr; }
            .admin-sidebar { display: flex; overflow-x: auto; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; gap: 8px; }
            .admin-sidebar-btn { white-space: nowrap; }
        }
        .admin-sidebar { background: var(--bg-dark-surface); border-radius: var(--radius-md); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .admin-sidebar-btn { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-sm); color: #AAAAAA; text-decoration: none; font-size: 0.88rem; font-weight: 600; background: transparent; border: none; cursor: pointer; text-align: left; transition: var(--transition); width: 100%; }
        .admin-sidebar-btn:hover, .admin-sidebar-btn.active { background: rgba(197,160,89,0.15); color: var(--accent-gold); }

        .card { background: var(--bg-card); border-radius: var(--radius-md); padding: 20px; border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); margin-bottom: 20px; transition: var(--transition); }
        .card:hover { box-shadow: var(--shadow-md); }
        .card-dark { background: var(--bg-dark); color: var(--text-light); border: none; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border-radius: var(--radius-md); font-weight: 700; font-size: 0.9rem; cursor: pointer; border: none; transition: var(--transition); text-decoration: none; }
        .btn-primary { background: var(--bg-dark); color: #FFFFFF; }
        .btn-primary:hover { background: #2A2A2A; transform: translateY(-1px); }
        .btn-gold { background: var(--accent-gold); color: #FFFFFF; box-shadow: 0 4px 14px rgba(197,160,89,0.35); }
        .btn-gold:hover { background: var(--accent-gold-hover); transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1.5px solid var(--border-color); color: var(--text-primary); }
        .btn-outline:hover { background: var(--border-light); }
        .btn-danger { background: var(--status-danger); color: #FFF; }
        .btn-sm { padding: 8px 14px; font-size: 0.8rem; border-radius: var(--radius-sm); }
        .btn-full { width: 100%; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control { width: 100%; padding: 12px 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--border-color); background: var(--bg-surface); font-size: 0.92rem; color: var(--text-primary); transition: var(--transition); outline: none; }
        .form-control:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(197,160,89,0.15); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
        .section-title { font-size: 1.25rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.3px; }

        .camera-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .camera-card { background: var(--bg-card); border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; transition: var(--transition); }
        .camera-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .camera-img-wrap { position: relative; width: 100%; height: 190px; background: #F0EDE6; overflow: hidden; }
        .camera-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .camera-card:hover .camera-img-wrap img { transform: scale(1.05); }
        .badge-status { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
        .badge-available { background: #D1FAE5; color: #065F46; }
        .badge-booked { background: #FEE2E2; color: #991B1B; }
        .badge-maintenance { background: #FEF3C7; color: #92400E; }
        .camera-card-body { padding: 16px; display: flex; flex-direction: column; flex: 1; }
        .camera-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
        .camera-desc { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .camera-meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border-light); }
        .camera-price { font-size: 1.1rem; font-weight: 800; color: var(--text-primary); }
        .camera-price span { font-size: 0.75rem; font-weight: 500; color: var(--text-muted); }

        .status-pill { padding: 4px 12px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; display: inline-block; }
        .status-pending { background: #FEF3C7; color: #92400E; }
        .status-confirmed { background: #DBEAFE; color: #1E40AF; }
        .status-paid { background: #D1FAE5; color: #065F46; }
        .status-readyforpickup { background: #E0E7FF; color: #3730A3; }
        .status-completed { background: #D1FAE5; color: #065F46; }
        .status-cancelled { background: #FEE2E2; color: #991B1B; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: var(--transition); }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: var(--bg-card); border-radius: var(--radius-lg); width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: var(--shadow-lg); transform: translateY(20px); transition: var(--transition); }
        .modal-overlay.active .modal-box { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 1.2rem; font-weight: 800; }
        .modal-close { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 400; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--bg-dark); color: #FFF; padding: 12px 20px; border-radius: var(--radius-md); font-size: 0.88rem; font-weight: 600; box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease; border-left: 4px solid var(--accent-gold); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .calendar-grid-view { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; margin-top: 10px; }
        .calendar-day-header { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); padding: 4px 0; }
        .calendar-day-cell { position: relative; padding: 6px 4px; border-radius: var(--radius-sm); font-size: 0.82rem; font-weight: 600; background: var(--bg-primary); border: 1px solid var(--border-light); min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; cursor: default; transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .calendar-day-cell.empty { background: transparent; border: none; min-height: 46px; }
        .calendar-day-cell.today { outline: 2px solid var(--accent-gold); outline-offset: -2px; }
        .calendar-day-cell.booked { background: #FEF3C7; color: #92400E; border-color: #FCD34D; cursor: pointer; }
        .calendar-day-cell.booked:hover { transform: scale(1.05); box-shadow: 0 4px 10px rgba(197,160,89,0.35); z-index: 2; }
        .calendar-day-cell.booked-start, .calendar-day-cell.booked-end { background: var(--accent-gold); color: #FFF; border-color: var(--accent-gold-hover); }
        .cal-badge { font-size: 0.6rem; font-weight: 800; margin-top: 2px; line-height: 1; opacity: 0.9; }
        .cal-month-pill { display: inline-block; padding: 6px 12px; border-radius: var(--radius-full); font-size: 0.72rem; font-weight: 700; background: var(--bg-primary); border: 1.5px solid var(--border-color); cursor: pointer; transition: var(--transition); }
        .cal-month-pill:hover { border-color: var(--accent-gold); background: var(--accent-gold-light); }
        .cal-month-pill.active { background: var(--accent-gold); color: #FFF; border-color: var(--accent-gold); }

        .promo-banner { background: linear-gradient(135deg, #1E1E1E 0%, #2D251E 100%); color: #FFFFFF; border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; position: relative; overflow: hidden; border: 1px solid rgba(197,160,89,0.3); }
        .promo-banner::after { content: ''; position: absolute; right: -20px; bottom: -20px; width: 120px; height: 120px; background: var(--accent-gold); opacity: 0.15; border-radius: 50%; }

        .rating-stars { color: var(--accent-gold); font-size: 0.85rem; }

        .table-responsive { width: 100%; overflow-x: auto; }
        table.data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
        table.data-table th, table.data-table td { padding: 12px 14px; border-bottom: 1px solid var(--border-light); }
        table.data-table th { background: var(--bg-primary); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; font-weight: 700; }

        .tnc-preview { cursor: pointer; background: var(--bg-primary); padding: 12px; border-radius: var(--radius-sm); max-height: 100px; overflow-y: auto; font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 12px; border: 1px solid var(--border-light); white-space: pre-wrap; position: relative; transition: var(--transition); }
        .tnc-preview:hover { border-color: var(--accent-gold); background: var(--accent-gold-light); }
        .tnc-preview-fade { position: sticky; bottom: 0; margin-top: -20px; background: linear-gradient(to top, var(--bg-primary) 60%, transparent 100%); padding-top: 26px; text-align: center; font-weight: 800; color: var(--accent-gold); font-size: 0.72rem; letter-spacing: 0.4px; }

        .confirm-form-header { background: linear-gradient(135deg, #1E1E1E 0%, #2D251E 100%); color: #fff; padding: 16px 20px; border-radius: var(--radius-sm); margin-bottom: 16px; }
        .confirm-form-header h4 { font-size: 0.95rem; font-weight: 800; letter-spacing: 0.5px; color: var(--accent-gold); margin-bottom: 4px; }
        .confirm-form-header p { font-size: 0.75rem; opacity: 0.85; line-height: 1.4; }

        .confirm-readonly-box { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 16px; font-size: 0.82rem; }
        .confirm-readonly-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; gap: 10px; }
        .confirm-readonly-row + .confirm-readonly-row { border-top: 1px dashed var(--border-light); }
        .confirm-readonly-row span:first-child { color: var(--text-secondary); font-weight: 600; }
        .confirm-readonly-row strong { color: var(--text-primary); font-weight: 800; text-align: right; }

        .sig-pad-wrap { border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); background: #FFF; position: relative; transition: var(--transition); }
        .sig-pad-wrap.filled { border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(197,160,89,0.1); }
        .sig-pad-wrap canvas { width: 100%; height: 120px; display: block; touch-action: none; cursor: crosshair; border-radius: var(--radius-sm); }
        .sig-pad-clear { position: absolute; top: 6px; right: 6px; background: rgba(255,255,255,0.9); border: 1px solid var(--border-light); color: var(--text-muted); cursor: pointer; font-size: 0.7rem; padding: 3px 8px; border-radius: 20px; font-weight: 700; }
        .sig-pad-clear:hover { color: var(--status-danger); border-color: var(--status-danger); }
        .sig-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: var(--text-muted); pointer-events: none; font-style: italic; }
        .sig-pad-wrap.filled .sig-hint { display: none; }

        .owner-sig-note { background: var(--bg-primary); border: 1px dashed var(--border-color); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 0.78rem; color: var(--text-secondary); display: flex; gap: 10px; align-items: flex-start; }
        .owner-sig-note i { color: var(--accent-gold); margin-top: 2px; }

        .sig-display { background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 4px; max-width: 220px; }
        .sig-display img { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>

<div id="app-loading" style="position:fixed;inset:0;background:#FAFAFA;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;">
    <i class="fa-solid fa-camera-retro" style="font-size:2.6rem;color:#C5A059;"></i>
    <div style="font-weight:800;letter-spacing:3px;color:#121212;">CLICKIE</div>
    <div style="font-size:0.8rem;color:#999;">Menyambung ke pangkalan data...</div>
</div>

<div id="app-container">
    <header class="app-header">
        <a class="brand-logo" onclick="switchView('home')">
            <i class="fa-solid fa-camera-retro"></i>
            <span>CLICKIE</span>
        </a>
        <div class="header-actions">
            <button id="pwa-install-btn" class="btn-install-pwa" onclick="installPWA()">
                <i class="fa-solid fa-download"></i> Install App
            </button>
            <!-- ===== AUTH AREA (dinamik) ===== -->
            <div id="header-auth-area"></div>
        </div>
    </header>

    <main class="main-content" id="main-view"></main>

async function loadCollection(key, defaults, isArray) {
    let local = null;
    try { const raw = localStorage.getItem("clickie_" + key); if (raw) local = JSON.parse(raw); } catch (e) {}
    if (!fbDb) return local !== null ? local : defaults;

    try {
        const snap = await fbDb.ref(FB_ROOT + "/" + key).once("value");
        if (snap.exists() && snap.val() !== null) {
            const v = snap.val();
            let data = isArray ? (Array.isArray(v) ? v : Object.values(v)) : v;
            if (!isArray && defaults && typeof defaults === "object") data = Object.assign({}, defaults, data);
            try { localStorage.setItem("clickie_" + key, JSON.stringify(data)); } catch (e) {}
            return data;
        }
        const seed = local !== null ? local : defaults;
        await fbDb.ref(FB_ROOT + "/" + key).set(seed);
        console.log("🌱 Seeded Firebase node:", key);
        return seed;
    } catch (err) {
        console.warn("Firebase read failed [" + key + "]:", err);
        return local !== null ? local : defaults;
    }
}

function setupSignaturePads() {
    setupSignatureCanvas("sig-renter");
}

function setupSignatureCanvas(canvasId) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    const cssWidth = canvas.offsetWidth || canvas.parentElement.offsetWidth || 300;
    const cssHeight = 120;
    const dpr = window.devicePixelRatio || 1;

    canvas.width = cssWidth * dpr;
    canvas.height = cssHeight * dpr;
    canvas.style.width = cssWidth + "px";
    canvas.style.height = cssHeight + "px";

    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.strokeStyle = "#121212";
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    signaturePads[canvasId] = { hasContent: false, canvas };

    let drawing = false;
    let lastPoint = null;

    const getPoint = (e) => {
        const r = canvas.getBoundingClientRect();
        let clientX, clientY;
        if (e.touches && e.touches.length) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
        else { clientX = e.clientX; clientY = e.clientY; }
        return { x: clientX - r.left, y: clientY - r.top };
    };

    const start = (e) => {
        e.preventDefault();
        drawing = true;
        lastPoint = getPoint(e);
        ctx.beginPath();
        ctx.moveTo(lastPoint.x, lastPoint.y);
    };

    const move = (e) => {
        if (!drawing) return;
        e.preventDefault();
        const p = getPoint(e);
        ctx.beginPath();
        ctx.moveTo(lastPoint.x, lastPoint.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        lastPoint = p;
        if (!signaturePads[canvasId].hasContent) {
            signaturePads[canvasId].hasContent = true;
            canvas.parentElement.classList.add("filled");
            validateBookingFormState();
        }
    };

    const end = () => { drawing = false; lastPoint = null; };

    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    canvas.addEventListener("mouseup", end);
    canvas.addEventListener("mouseleave", end);
    canvas.addEventListener("touchstart", start, { passive: false });
    canvas.addEventListener("touchmove", move, { passive: false });
    canvas.addEventListener("touchend", end);
    canvas.addEventListener("touchcancel", end);
}

function clearSignature(canvasId) {
    const pad = signaturePads[canvasId];
    const canvas = document.getElementById(canvasId);
    if (!canvas || !pad) return;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pad.hasContent = false;
    canvas.parentElement.classList.remove("filled");
    validateBookingFormState();
}

function getSignatureData(canvasId) {
    const canvas = document.getElementById(canvasId);
    if (!canvas || !signaturePads[canvasId]?.hasContent) return null;
    try { return canvas.toDataURL("image/png"); } catch (e) { return null; }
}

function showTnCModal() {
    const modal = document.getElementById("global-modal");
    const modalContent = document.getElementById("global-modal-content");

    const lines = (settings.terms || "").split("\n").filter(l => l.trim() !== "");
    const termsHtml = lines.map(line => {
        const m = line.match(/^(\d+)\.\s*(.+)$/);
        if (m) return `
            <div style="display:flex; gap:10px; margin-bottom:14px; padding:10px 12px; background:var(--bg-primary); border-radius:var(--radius-sm); border-left:3px solid var(--accent-gold);">
                <div style="min-width:24px; height:24px; border-radius:50%; background:var(--accent-gold); color:#fff; font-size:0.75rem; font-weight:800; display:flex; align-items:center; justify-content:center;">${m[1]}</div>
                <div style="flex:1; line-height:1.55;">${m[2]}</div>
            </div>
        `;
        return `<div style="margin-bottom:10px; line-height:1.55;">${line}</div>`;
    }).join("");

    modalContent.innerHTML = `
        <div class="modal-header">
            <h3 class="modal-title"><i class="fa-solid fa-file-contract" style="color: var(--accent-gold);"></i> Terms & Conditions</h3>
            <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div style="background: var(--accent-gold-light); border: 1px solid rgba(197,160,89,0.25); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 16px; font-size: 0.78rem; color: #7A5F2E;">
            <i class="fa-solid fa-circle-info"></i> Sila baca dengan teliti sebelum menandatangani persetujuan.
        </div>
        <div style="font-size: 0.85rem; color: var(--text-primary); max-height: 55vh; overflow-y: auto; padding-right: 4px;">
            ${termsHtml || '<em style="color: var(--text-muted);">Tiada kandungan T&C.</em>'}
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn btn-outline" style="flex:1;" onclick="closeModal()">Tutup</button>
            <button class="btn btn-gold" style="flex:1;" onclick="acceptTnCFromModal()"><i class="fa-solid fa-check"></i> Saya Setuju</button>
        </div>
    `;
    modal.classList.add("active");
}

function acceptTnCFromModal() {
    closeModal();
    const cb = document.getElementById("book-tnc-checkbox");
    if (cb) { cb.checked = true; validateBookingFormState(); }
    showToast("Terms & Conditions telah diterima.");
    setTimeout(() => {
        const confirmNameEl = document.getElementById("confirm-name");
        if (confirmNameEl) confirmNameEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 200);
}

function updatePaymentUI() {
    const selectedPay = document.querySelector('input[name="payment-method"]:checked')?.value;
    const box = document.getElementById('ewallet-info-box');
    if (box) box.style.display = (selectedPay === 'E-Wallet') ? 'block' : 'none';
}

function triggerAvailabilityCheck() {
    const cam = appState.selectedCameraForBooking;
    if (!cam) return;

    const startDate = document.getElementById("book-start-date")?.value;
    const endDate = document.getElementById("book-end-date")?.value;
    const startTime = document.getElementById("book-start-time")?.value;
    const endTime = document.getElementById("book-end-time")?.value;
    const statusBox = document.getElementById("availability-status-box");

    if (!startDate || !endDate) {
        if (statusBox) statusBox.style.display = "none";
        updateConfirmReadonlyBox("", "", 0, 0);
        validateBookingFormState();
        return;
    }

    const check = checkCameraAvailability(cam.id, startDate, endDate, startTime, endTime);
    const s = new Date(`${startDate}T${startTime}`);
    const e = new Date(`${endDate}T${endTime}`);
    let days = Math.ceil((e - s) / (1000 * 60 * 60 * 24));
    if (days < 1) days = 1;

    const rentalSubtotal = days * cam.pricePerDay;
    const grandTotal = rentalSubtotal + cam.deposit;

    document.getElementById("summary-duration").innerText = `${days} Day(s)`;
    document.getElementById("summary-subtotal").innerText = `RM ${rentalSubtotal}`;
    document.getElementById("summary-total").innerText = `RM ${grandTotal}`;

    updateConfirmReadonlyBox(startDate, endDate, days, grandTotal);

    if (statusBox) {
        statusBox.style.display = "block";
        if (check.available) {
            statusBox.style.background = "#D1FAE5";
            statusBox.style.color = "#065F46";
            statusBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> Camera is <strong>AVAILABLE</strong> untuk tarikh & masa ini!`;
        } else {
            statusBox.style.background = "#FEE2E2";
            statusBox.style.color = "#991B1B";
            statusBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${check.reason}`;
        }
    }

    validateBookingFormState();
}

function updateConfirmReadonlyBox(startDate, endDate, days, total) {
    const periodEl = document.getElementById("confirm-period");
    const totalEl = document.getElementById("confirm-total");
    if (periodEl) {
        if (startDate && endDate) periodEl.textContent = `${startDate} hingga ${endDate} (${days} hari)`;
        else periodEl.textContent = "— pilih tarikh dahulu —";
    }
    if (totalEl) totalEl.textContent = total > 0 ? `RM ${total}` : "—";
}

function validateBookingFormState() {
    const cam = appState.selectedCameraForBooking;
    const startDate = document.getElementById("book-start-date")?.value;
    const endDate = document.getElementById("book-end-date")?.value;
    const startTime = document.getElementById("book-start-time")?.value;
    const endTime = document.getElementById("book-end-time")?.value;
    const pickupLoc = document.getElementById("book-pickup-loc")?.value?.trim();
    const returnLoc = document.getElementById("book-return-loc")?.value?.trim();
    const tncAccepted = document.getElementById("book-tnc-checkbox")?.checked;
    const btn = document.getElementById("btn-submit-booking");

    const confirmName = document.getElementById("confirm-name")?.value?.trim();
    const confirmIC = document.getElementById("confirm-ic")?.value?.trim();
    const confirmPhone = document.getElementById("confirm-phone")?.value?.trim();
    const confirmAddress = document.getElementById("confirm-address")?.value?.trim();
    const renterDate = document.getElementById("confirm-renter-date")?.value;
    const hasSignature = signaturePads["sig-renter"]?.hasContent === true;

    if (!btn || !cam) return;

    const check = checkCameraAvailability(cam.id, startDate, endDate, startTime, endTime);
    const bookingValid = startDate && endDate && startTime && endTime && pickupLoc && returnLoc && check.available;
    const tncValid = tncAccepted;
    const confirmValid = confirmName && confirmIC && confirmPhone && confirmAddress && renterDate && hasSignature;

    btn.disabled = !(bookingValid && tncValid && confirmValid);

    const hint = document.getElementById("submit-hint");
    if (hint) {
        if (btn.disabled) {
            const missing = [];
            if (!startDate || !endDate) missing.push("tarikh");
            if (!check.available) missing.push("ketersediaan");
            if (!tncValid) missing.push("T&C");
            if (!confirmName) missing.push("nama");
            if (!confirmIC) missing.push("IC");
            if (!confirmPhone) missing.push("telefon");
            if (!confirmAddress) missing.push("alamat");
            if (!hasSignature) missing.push("tandatangan");
            if (!renterDate) missing.push("tarikh tandatangan");
            hint.innerHTML = `<i class="fa-solid fa-circle-info"></i> Perlu lengkapkan: <strong>${missing.join(", ")}</strong>`;
            hint.style.color = "#999";
            hint.style.fontWeight = "400";
        } else {
            hint.innerHTML = `<i class="fa-solid fa-circle-check" style="color: var(--accent-gold);"></i> Semua lengkap — boleh teruskan tempahan!`;
            hint.style.color = "var(--accent-gold)";
            hint.style.fontWeight = "700";
        }
    }
}

function processBookingCheckout() {
    if (!appState.currentUser) { showToast("Sila log masuk terlebih dahulu."); switchView("login"); return; }

    const cam = appState.selectedCameraForBooking;
    const startDate = document.getElementById("book-start-date").value;
    const endDate = document.getElementById("book-end-date").value;
    const startTime = document.getElementById("book-start-time").value;
    const endTime = document.getElementById("book-end-time").value;
    const pickupLocation = document.getElementById("book-pickup-loc").value;
    const returnLocation = document.getElementById("book-return-loc").value;
    const paymentMethod = document.querySelector('input[name="payment-method"]:checked').value;

    const confirmationData = {
        renterName: document.getElementById("confirm-name").value.trim(),
        renterIC: document.getElementById("confirm-ic").value.trim(),
        renterPhone: document.getElementById("confirm-phone").value.trim(),
        renterAddress: document.getElementById("confirm-address").value.trim(),
        renterSignature: getSignatureData("sig-renter"),
        renterDate: document.getElementById("confirm-renter-date").value,
        ownerSignature: null,
        ownerDate: null,
        agreedAt: new Date().toISOString()
    };

    const s = new Date(`${startDate}T${startTime}`);
    const e = new Date(`${endDate}T${endTime}`);
    let days = Math.ceil((e - s) / (1000 * 60 * 60 * 24));
    if (days < 1) days = 1;

    const rentalFee = days * cam.pricePerDay;
    const totalPrice = rentalFee + cam.deposit;

    const newBooking = {
        id: "CLK-" + new Date().toISOString().slice(0,10).replace(/-/g,'') + "-" + Math.floor(100 + Math.random() * 900),
        userId: appState.currentUser.id,
        userName: appState.currentUser.name,
        userPhone: appState.currentUser.phone,
        cameraId: cam.id,
        cameraName: cam.name,
        startDate, endDate, startTime, endTime,
        pickupLocation, returnLocation,
        days, rentalFee,
        deposit: cam.deposit,
        totalPrice,
        paymentMethod,
        paymentStatus: paymentMethod === "E-Wallet" ? "Pending" : "Verified",
        status: "Pending",
        createdAt: new Date().toISOString().split('T')[0],
        confirmation: confirmationData
    };

    bookings.unshift(newBooking);
    dbSet("bookings", bookings);
    showToast("Booking submitted successfully!");

    const modal = document.getElementById("global-modal");
    const modalContent = document.getElementById("global-modal-content");
    modalContent.innerHTML = `
        <div style="text-align: center; padding: 10px 0;">
            <i class="fa-solid fa-circle-check" style="font-size: 3.5rem; color: var(--accent-gold); margin-bottom: 16px;"></i>
            <h2 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 6px;">Booking Submitted!</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 20px;">Booking ID anda: <strong>${newBooking.id}</strong></p>
            <div style="background: var(--bg-primary); padding: 14px; border-radius: var(--radius-sm); text-align: left; font-size: 0.82rem; margin-bottom: 20px;">
                <div><strong>Camera:</strong> ${newBooking.cameraName}</div>
                <div><strong>Date:</strong> ${newBooking.startDate} to ${newBooking.endDate}</div>
                <div><strong>Total:</strong> RM ${newBooking.totalPrice}</div>
                <div style="margin-top:8px; padding-top:8px; border-top: 1px dashed var(--border-color); font-size: 0.75rem; color: var(--text-secondary);">
                    <i class="fa-solid fa-file-signature" style="color: var(--accent-gold);"></i> Pengesahan penyewa telah direkodkan.
                </div>
            </div>
            <button class="btn btn-gold btn-full" onclick="closeModalAndGo('my-bookings')">View My Bookings</button>

function handleLoginSubmit(e) {
    e.preventDefault();
    const email = document.getElementById("login-email").value.trim();
    const pass = document.getElementById("login-password").value;
    const user = users.find(u => u.email === email && u.password === pass);
    if (user) {
        appState.currentUser = user;
        localStorage.setItem("clickie_session_user", JSON.stringify(user));
        renderHeaderAuth();
        showToast(`Selamat kembali, ${user.name}!`);
        if (user.role === "admin") switchView("admin", "dashboard");
        else switchView("home");
    } else showToast("Email atau kata laluan salah.");
}

function handleRegisterSubmit(e) {
    e.preventDefault();
    const name = document.getElementById("reg-name").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const phone = document.getElementById("reg-phone").value.trim();
    const pass = document.getElementById("reg-password").value;
    if (users.some(u => u.email === email)) { showToast("Email sudah didaftarkan!"); return; }
    const newUser = { id: "usr-" + Date.now(), name, email, phone, password: pass, role: "customer" };
    users.push(newUser);
    dbSet("users", users);
    appState.currentUser = newUser;
    localStorage.setItem("clickie_session_user", JSON.stringify(newUser));
    renderHeaderAuth();
    showToast("Akaun berjaya dicipta!");
    switchView("home");
}

function logoutUser() {
    appState.currentUser = null;
    localStorage.removeItem("clickie_session_user");
    // Set flag supaya auto-login demo tidak berlaku sampai user login sendiri
    localStorage.setItem("clickie_logged_out", "1");
    closeModal();
    renderHeaderAuth();
    showToast("Anda telah log keluar.");
    switchView("home");
}

let tempUploadedImageBase64 = null;

function previewImageFile(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
            tempUploadedImageBase64 = evt.target.result;
            document.getElementById("image-upload-preview").src = tempUploadedImageBase64;
        };
        reader.readAsDataURL(file);
    }
}

function openEditCameraModal(camId) { tempUploadedImageBase64 = null; openAddCameraModal(camId); }

function saveCameraForm(e, editId) {
    e.preventDefault();
    const name = document.getElementById("cam-input-name").value;
    const pricePerDay = parseFloat(document.getElementById("cam-input-price").value);
    const deposit = parseFloat(document.getElementById("cam-input-deposit").value);
    const description = document.getElementById("cam-input-desc").value;
    const specs = document.getElementById("cam-input-specs").value;
    const included = document.getElementById("cam-input-included").value;
    const status = document.getElementById("cam-input-status").value;
    let image = tempUploadedImageBase64;

    if (editId) {
        const cam = cameras.find(c => c.id === editId);
        if (!image) image = cam.image;
        cam.name = name; cam.pricePerDay = pricePerDay; cam.deposit = deposit;
        cam.description = description; cam.specs = specs; cam.included = included;
        cam.status = status; cam.image = image;
    } else {
        if (!image) image = "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=600&q=80";
        cameras.push({ id: "cam-" + Date.now(), name, pricePerDay, deposit, description, specs, included, rules: "Handle with care.", status, rating: 5.0, reviewsCount: 1, image });
    }
    dbSet("cameras", cameras);
    closeModal();
    showToast("Camera inventory updated!");
    switchView("admin", "cameras");
}

function deleteCamera(camId) {
    if (confirm("Delete this camera?")) {
        cameras = cameras.filter(c => c.id !== camId);
        dbSet("cameras", cameras);
        showToast("Camera deleted.");
        switchView("admin", "cameras");
    }
}

function updateBookingStatus(bookingId, newStatus) {

        dbSet("bookings", bookings);
        showToast(`Booking ${bookingId} → ${newStatus}`);
        switchView("admin", "bookings");
    }
}

const MONTH_NAMES = ["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
const MONTH_SHORT = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
function getDaysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }
function ensureCalendarMonth() {
    if (!appState.adminCalendarMonth) {
        const now = new Date();
        appState.adminCalendarMonth = { year: now.getFullYear(), month: now.getMonth() };
    }
    return appState.adminCalendarMonth;
}

function renderAdminCalendarView() {
    const { year, month } = ensureCalendarMonth();
    const monthLabel = `${MONTH_NAMES[month]} ${year}`;
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = getDaysInMonth(year, month);
    const monthStart = new Date(year, month, 1, 0, 0, 0);
    const monthEnd = new Date(year, month, daysInMonth, 23, 59, 59);

    const monthBookings = bookings.filter(b => {
        if (b.status === 'Cancelled' || !b.startDate || !b.endDate) return false;
        const bs = new Date(b.startDate + 'T00:00:00');
        const be = new Date(b.endDate + 'T23:59:59');
        return bs <= monthEnd && be >= monthStart;
    });

    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

    let cells = '';
    for (let i = 0; i < firstDay; i++) cells += `<div class="calendar-day-cell empty"></div>`;

    for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayBookings = monthBookings.filter(b => b.startDate <= dateStr && b.endDate >= dateStr);
        const isStart = monthBookings.some(b => b.startDate === dateStr);
        const isEnd = monthBookings.some(b => b.endDate === dateStr);
        const isToday = dateStr === todayStr;
        const hasBooking = dayBookings.length > 0;

        let classes = 'calendar-day-cell';
        if (hasBooking) classes += ' booked';
        if (isStart || isEnd) classes += ' booked-start';
        if (isToday) classes += ' today';
        const clickAttr = hasBooking ? `onclick="showCalendarDayBookings('${dateStr}')"` : '';

        cells += `
            <div class="${classes}" ${clickAttr}>
                <div>${d}</div>
                ${hasBooking ? `<div class="cal-badge">${dayBookings.length}📷</div>` : ''}
            </div>
        `;
    }

    const nowKey = today.getFullYear() * 12 + today.getMonth();
    const monthSummary = {};
    bookings.forEach(b => {
        if (b.status === 'Cancelled' || !b.startDate) return;
        const d = new Date(b.startDate + 'T00:00:00');
        const key = d.getFullYear() * 12 + d.getMonth();
        if (key >= nowKey) monthSummary[key] = (monthSummary[key] || 0) + 1;
    });
    const futureMonths = Object.keys(monthSummary).map(k => parseInt(k)).sort((a,b) => a-b).map(k => ({ year: Math.floor(k / 12), month: k % 12, count: monthSummary[k] }));
    const hasUpcoming = futureMonths.length > 0;

    return `
        <div class="section-header">
            <div>
                <h2 style="font-size: 1.3rem; font-weight: 800;">Booking Calendar</h2>
                <p style="font-size: 0.82rem; color: var(--text-secondary);">Ketik tarikh berlatar kuning untuk lihat detail booking.</p>
            </div>
            ${hasUpcoming ? `<button class="btn btn-gold btn-sm" onclick="jumpAdminCalendarToUpcoming()"><i class="fa-solid fa-forward"></i> Booking Terdekat</button>` : ''}
        </div>

        <div class="card" style="padding: 14px 16px; margin-bottom: 14px;">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                <button class="btn btn-outline btn-sm" onclick="changeAdminCalendarMonth(-1)" style="min-width:44px; padding: 10px 12px;"><i class="fa-solid fa-chevron-left"></i></button>
                <div style="text-align: center; flex: 1; min-width: 0;">
                    <div style="font-size: 0.68rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px;">BULAN DIPAPARKAN</div>
                    <div style="font-size: 1.2rem; font-weight: 800; margin-top: 2px;">${monthLabel}</div>
                    <div style="font-size: 0.72rem; color: var(--text-secondary); margin-top: 2px;">
                        ${monthBookings.length > 0 ? `${monthBookings.length} booking pada bulan ini` : 'Tiada booking pada bulan ini'}
                    </div>
                </div>
                <button class="btn btn-outline btn-sm" onclick="changeAdminCalendarMonth(1)" style="min-width:44px; padding: 10px 12px;"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <button class="btn btn-outline btn-sm btn-full" style="margin-top: 10px;" onclick="jumpAdminCalendarToToday()"><i class="fa-solid fa-calendar-day"></i> Kembali ke Bulan Ini</button>
        </div>

        <div class="card">
            <div class="calendar-grid-view">
                <div class="calendar-day-header">SUN</div>
                <div class="calendar-day-header">MON</div>
                <div class="calendar-day-header">TUE</div>
                <div class="calendar-day-header">WED</div>
                <div class="calendar-day-header">THU</div>
                <div class="calendar-day-header">FRI</div>
                <div class="calendar-day-header">SAT</div>
                ${cells}
            </div>
        </div>

        <div class="card" style="padding: 12px 16px;">
            <div style="display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.72rem; color: var(--text-secondary);">
                <div style="display: flex; align-items: center; gap: 6px;"><span style="width:14px; height:14px; border-radius:3px; background:#FEF3C7; border:1px solid #FCD34D;"></span> Ada booking (ketik)</div>
                <div style="display: flex; align-items: center; gap: 6px;"><span style="width:14px; height:14px; border-radius:3px; background:var(--accent-gold);"></span> Tarikh mula / tamat</div>
                <div style="display: flex; align-items: center; gap: 6px;"><span style="width:14px; height:14px; border-radius:3px; background:#fff; outline:2px solid var(--accent-gold); outline-offset:-2px;"></span> Hari ini</div>
            </div>
        </div>

        ${monthBookings.length > 0 ? `
            <div style="margin-top: 20px;">
                <h3 style="font-size: 1rem; font-weight: 800; margin-bottom: 12px;"><i class="fa-solid fa-list" style="color: var(--accent-gold);"></i> Booking pada ${monthLabel} (${monthBookings.length})</h3>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    ${monthBookings.slice().sort((a,b) => (a.startDate + a.startTime).localeCompare(b.startDate + b.startTime)).map(b => `
                        <div class="card" style="margin: 0; padding: 12px 14px; cursor: pointer; border-left: 4px solid var(--accent-gold);" onclick="showBookingDetailModal('${b.id}')">
                            <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start;">
                                <div style="min-width:0;">
                                    <div style="font-size:0.7rem; color:var(--text-muted); font-weight:700; letter-spacing:0.5px;">${b.id}</div>
                                    <div style="font-size:0.95rem; font-weight:800; margin-top:2px;">${b.cameraName}</div>
                                    <div style="font-size:0.75rem; color:var(--text-secondary); margin-top:4px;">
                                        <i class="fa-solid fa-user"></i> ${b.userName} •
                                        <i class="fa-solid fa-calendar"></i> ${b.startDate} → ${b.endDate}
                                    </div>
                                </div>
                                <div style="text-align:right; flex-shrink:0;">
                                    <span class="status-pill status-${b.status.toLowerCase().replace(/\s/g,'')}">${b.status}</span>
                                    <div style="font-size:0.85rem; font-weight:800; color:var(--accent-gold); margin-top:6px;">RM ${b.totalPrice}</div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        ` : `
            <div class="card" style="text-align:center; padding: 30px 20px; margin-top: 20px;">
                <i class="fa-regular fa-calendar-xmark" style="font-size: 2rem; color: var(--text-muted); margin-bottom: 10px;"></i>
                <p style="font-size: 0.85rem; color: var(--text-secondary);">Tiada booking pada bulan ini.</p>
            </div>
        `}

        ${hasUpcoming ? `
            <div class="card" style="margin-top: 20px;">
                <h3 style="font-size: 0.95rem; font-weight: 800; margin-bottom: 10px;"><i class="fa-solid fa-chart-simple" style="color: var(--accent-gold);"></i> Bulan Dengan Booking Akan Datang</h3>
                <div style="display:flex; flex-wrap:wrap; gap:8px;">
                    ${futureMonths.map(fm => {
                        const isActive = fm.year === year && fm.month === month;
                        return `<button class="cal-month-pill ${isActive ? 'active' : ''}" onclick="jumpAdminCalendarTo(${fm.year}, ${fm.month})">${MONTH_SHORT[fm.month]} ${fm.year} <span style="opacity:0.8; margin-left:4px;">(${fm.count})</span></button>`;
                    }).join('')}
                </div>
            </div>
        ` : ''}
    `;
}

function changeAdminCalendarMonth(delta) {
    const c = ensureCalendarMonth();
    let m = c.month + delta, y = c.year;
    while (m < 0) { m += 12; y -= 1; }
    while (m > 11) { m -= 12; y += 1; }
    appState.adminCalendarMonth = { year: y, month: m };
    const scrollY = window.scrollY;
    document.getElementById("main-view").innerHTML = renderAdminView("calendar");
    window.scrollTo(0, scrollY);
}

function jumpAdminCalendarTo(year, month) {
    appState.adminCalendarMonth = { year, month };
    const scrollY = window.scrollY;
    document.getElementById("main-view").innerHTML = renderAdminView("calendar");
    window.scrollTo(0, scrollY);
}

function jumpAdminCalendarToToday() {
    const now = new Date();
    appState.adminCalendarMonth = { year: now.getFullYear(), month: now.getMonth() };
    const scrollY = window.scrollY;
    document.getElementById("main-view").innerHTML = renderAdminView("calendar");
    window.scrollTo(0, scrollY);
}

function jumpAdminCalendarToUpcoming() {
    const today = new Date();
    const nowKey = today.getFullYear() * 12 + today.getMonth();
    let bestKey = null;
    bookings.forEach(b => {
        if (b.status === 'Cancelled' || !b.startDate) return;
        const d = new Date(b.startDate + 'T00:00:00');
        const key = d.getFullYear() * 12 + d.getMonth();
        if (key >= nowKey && (bestKey === null || key < bestKey)) bestKey = key;
    });
    if (bestKey === null) { showToast("Tiada booking akan datang."); return; }
    appState.adminCalendarMonth = { year: Math.floor(bestKey / 12), month: bestKey % 12 };
    const scrollY = window.scrollY;
    document.getElementById("main-view").innerHTML = renderAdminView("calendar");
    window.scrollTo(0, scrollY);
}

function showCalendarDayBookings(dateStr) {
    const dayBookings = bookings.filter(b => b.status !== 'Cancelled' && b.startDate && b.endDate && b.startDate <= dateStr && b.endDate >= dateStr);
    if (dayBookings.length === 0) return;

    const modal = document.getElementById("global-modal");
    const modalContent = document.getElementById("global-modal-content");

    modalContent.innerHTML = `
        <div class="modal-header">
            <h3 class="modal-title"><i class="fa-regular fa-calendar" style="color: var(--accent-gold);"></i> ${dateStr}</h3>
            <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 14px;">${dayBookings.length} booking pada tarikh ini</div>
        <div style="display:flex; flex-direction:column; gap:10px;">
            ${dayBookings.map(b => `
                <div style="padding:12px; background:var(--bg-primary); border-radius:var(--radius-sm); border-left:3px solid var(--accent-gold);">
                    <div style="display:flex; justify-content:space-between; gap:8px; margin-bottom:6px; align-items:center;">
                        <strong style="font-size:0.9rem;">${b.cameraName}</strong>
                        <span class="status-pill status-${b.status.toLowerCase().replace(/\s/g,'')}">${b.status}</span>
                    </div>
                    <div style="font-size:0.78rem; color:var(--text-secondary); display:flex; flex-direction:column; gap:3px;">
                        <div>👤 <strong>${b.userName}</strong> (${b.userPhone || 'N/A'})</div>
                        <div>📅 ${b.startDate} (${b.startTime}) → ${b.endDate} (${b.endTime})</div>
                        <div>📍 ${b.pickupLocation}</div>
                        <div>💰 RM ${b.totalPrice} • ${b.paymentMethod} (${b.paymentStatus})</div>
                    </div>
                    <button class="btn btn-outline btn-sm" style="margin-top:10px; width:100%;" onclick="showBookingDetailModal('${b.id}')"><i class="fa-solid fa-eye"></i> Lihat Detail Penuh</button>
                </div>
            `).join('')}
        </div>
        <button class="btn btn-primary btn-full" style="margin-top:16px;" onclick="closeModal()">Tutup</button>
    `;
    modal.classList.add("active");
}

function renderAdminPaymentSettings() {
    return `
        <h2 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 16px;">Payment Settings</h2>
        <div class="card">
            <form onsubmit="savePaymentSettings(event)">
                <div class="form-group"><label class="form-label">E-Wallet Name</label><input type="text" id="set-ewallet-name" class="form-control" value="${settings.ewalletName}"></div>
                <div class="form-group"><label class="form-label">E-Wallet Payment Link / QR URL</label><input type="url" id="set-ewallet-link" class="form-control" value="${settings.ewalletLink}"></div>
                <div class="form-group"><label class="form-label">Payment Instructions</label><textarea id="set-ewallet-instructions" class="form-control" rows="3">${settings.ewalletInstructions}</textarea></div>
                <div class="form-group"><label style="display: flex; align-items: center; gap: 8px; cursor: pointer;"><input type="checkbox" id="set-enable-cod" ${settings.enableCOD ? 'checked' : ''}><span>Enable Cash / COD Payment Method</span></label></div>
                <div class="form-group"><label style="display: flex; align-items: center; gap: 8px; cursor: pointer;"><input type="checkbox" id="set-enable-ewallet" ${settings.enableEWallet ? 'checked' : ''}><span>Enable E-Wallet Payment Method</span></label></div>
                <button type="submit" class="btn btn-gold btn-full">Save Payment Settings</button>
            </form>
        </div>
    `;
}

function savePaymentSettings(e) {
    e.preventDefault();
    settings.ewalletName = document.getElementById("set-ewallet-name").value;
    settings.ewalletLink = document.getElementById("set-ewallet-link").value;
    settings.ewalletInstructions = document.getElementById("set-ewallet-instructions").value;
    settings.enableCOD = document.getElementById("set-enable-cod").checked;
    settings.enableEWallet = document.getElementById("set-enable-ewallet").checked;
    dbSet("settings", settings);
    showToast("Payment settings updated!");
}

function renderAdminPromotionsView() {
    return `
        <div class="section-header">
            <h2 style="font-size: 1.3rem; font-weight: 800;">Promotions</h2>
            <button class="btn btn-gold btn-sm" onclick="openAddPromoModal()">+ Add Promotion</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 14px;">
            ${promotions.map(p => `
                <div class="card">
                    <h3 style="font-size: 1rem; font-weight: 800;">${p.title} (${p.discount})</h3>
                    <p style="font-size: 0.85rem; color: var(--text-secondary); margin: 6px 0;">${p.description}</p>
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px;">Valid: ${p.startDate} to ${p.endDate}</div>
                    <button class="btn btn-danger btn-sm" onclick="deletePromo('${p.id}')">Delete Promo</button>
                </div>
            `).join('')}
        </div>
    `;
}

function openAddPromoModal() {
    const modal = document.getElementById("global-modal");
    const modalContent = document.getElementById("global-modal-content");
    modalContent.innerHTML = `
        <div class="modal-header"><h3 class="modal-title">Add Promotion</h3><button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
        <form onsubmit="saveNewPromo(event)">
            <div class="form-group"><label class="form-label">Title</label><input type="text" id="promo-title" class="form-control" required></div>
            <div class="form-group"><label class="form-label">Discount Text</label><input type="text" id="promo-discount" class="form-control" required placeholder="20% OFF"></div>
            <div class="form-group"><label class="form-label">Description</label><textarea id="promo-desc" class="form-control" rows="2" required></textarea></div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Start Date</label><input type="date" id="promo-start" class="form-control" required></div>
                <div class="form-group"><label class="form-label">End Date</label><input type="date" id="promo-end" class="form-control" required></div>
            </div>
            <button type="submit" class="btn btn-gold btn-full">Save Promo</button>
        </form>
    `;
    modal.classList.add("active");
}

function saveNewPromo(e) {
    e.preventDefault();
    promotions.push({
        id: "promo-" + Date.now(),
        title: document.getElementById("promo-title").value,
        discount: document.getElementById("promo-discount").value,
        description: document.getElementById("promo-desc").value,
        startDate: document.getElementById("promo-start").value,
        endDate: document.getElementById("promo-end").value,
        active: true
    });
    dbSet("promotions", promotions);
    closeModal();
    showToast("Promotion created!");
    switchView("admin", "promotions");
}

function deletePromo(id) {
    promotions = promotions.filter(p => p.id !== id);
    dbSet("promotions", promotions);
    showToast("Promotion deleted.");
    switchView("admin", "promotions");
}

function renderAdminTnCEditor() {
    return `
        <h2 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 16px;">Terms & Conditions Editor</h2>
        <div class="card">
            <form onsubmit="saveTermsForm(event)">
                <div class="form-group"><label class="form-label">Rental Terms & Conditions Content</label><textarea id="tnc-editor-text" class="form-control" rows="10">${settings.terms}</textarea></div>
                <button type="submit" class="btn btn-gold btn-full">Save Terms & Conditions</button>
            </form>
        </div>
    `;
}

function saveTermsForm(e) {
    e.preventDefault();
    settings.terms = document.getElementById("tnc-editor-text").value;
    dbSet("settings", settings);
    showToast("Terms & Conditions updated!");
}

function renderAdminReviewsView() {
    return `
        <h2 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 16px;">Customer Reviews Moderation</h2>
        <div style="display: flex; flex-direction: column; gap: 14px;">
            ${reviews.map(r => `
                <div class="card" style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                    <div>
                        <strong>${r.userName}</strong> (${r.rating}⭐) - <span style="font-size:0.8rem; color:var(--text-muted);">${r.date}</span>
                        <p style="font-size:0.85rem; margin-top:4px;">"${r.review}"</p>
                    </div>
                    <button class="btn btn-danger btn-sm" onclick="deleteReviewAdmin('${r.id}')"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('')}
        </div>
    `;
}

function deleteReviewAdmin(id) {
    reviews = reviews.filter(r => r.id !== id);
    dbSet("reviews", reviews);
    showToast("Review removed.");
    switchView("admin", "reviews");
}

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('SW Registered!', reg))
            .catch(err => console.log('SW Registration Failed', err));
    });
}
</script>

</body>
</html>
